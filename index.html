<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{height:100%}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
</head>
<body>
<title>聖誕戲劇投影</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: presenter window = live stage on the left, next-slide preview + cue + timer on the right, controls underneath; audience window = the stage alone. Single dark look: it is a projection booth. */
:root{
  color-scheme:dark;
  --booth:#101417; --panel:#1a2024; --line:#2e383d; --ink:#e9e4d6; --dim:#97a09c;
  --gold:#e0b65a; --pine:#2f7d6b; --warn:#d9694c;
  --display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --ui:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
html,body{height:100%}
body{background:var(--booth);color:var(--ink);font-family:var(--ui);font-size:15px;overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;background:var(--booth);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stagewrap{min-height:0;min-width:0;display:grid;place-items:center;container-type:size}
.stage{position:relative;width:min(100cqw,calc(100cqh*16/9));aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden;border-radius:4px;cursor:pointer}
.layer{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.layer.on{opacity:1}
.layer svg{width:100%;height:100%;display:block;font-family:var(--display);font-weight:700}
.tone-past{filter:sepia(.55) saturate(.8) contrast(.96) brightness(.97)}
.tone-reveal{animation:reveal 6s 1.5s ease both}
@keyframes reveal{from{filter:sepia(.55) saturate(.8) contrast(.96) brightness(.97)}to{filter:sepia(0) saturate(1) contrast(1) brightness(1)}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 58%,rgba(0,0,0,.34))}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
.black.on{opacity:1}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-size:14px;max-width:90%}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,30%);gap:12px}
.side{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.lab{font-size:12px;color:var(--dim);letter-spacing:.08em}
.lab b{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:0}
.pvbox{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:4px;overflow:hidden;margin-top:6px}
.pvbox .layer{opacity:1;transition:none}
.pvbox *{animation-play-state:paused!important}
.cue{font-family:var(--display);font-size:20px;line-height:1.5;text-wrap:balance;margin-top:4px}
#hNow{margin-top:4px;line-height:1.5}
.snd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.snd input{width:110px;accent-color:var(--gold)}
.tracks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:0}
.trk{position:relative;padding:6px 12px 14px;text-align:left;display:flex;gap:10px;align-items:baseline}
.trk b{color:var(--gold);margin-right:2px}
.trk .tm{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pb{position:absolute;left:10px;right:10px;bottom:6px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.pb>i{display:block;height:100%;width:0;background:var(--gold)}
.trk.loop .pb>i{width:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 20px);background-size:20px 100%;animation:stripe .6s linear infinite}
.snd.paused .trk.loop .pb>i{animation-play-state:paused}
@keyframes stripe{to{background-position:20px 0}}
.sndtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:8px}
.sndtop input{flex:1;min-width:80px;accent-color:var(--gold)}
.fx{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fx button{text-align:left}
.fx button b{display:inline-block;min-width:1.4em;color:var(--gold)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--dim)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.big{background:var(--pine);border-color:var(--pine);font-weight:700;padding:8px 18px}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.count{font-variant-numeric:tabular-nums;color:var(--dim);margin-inline:4px}
.sp{flex:1}
.keys{font-size:12px;color:var(--dim)}
.bar{display:flex;flex-direction:column;gap:8px}
@media (max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:auto}.stagewrap{container-type:normal;display:block}.stage{width:100%}}

/* audience window: nothing but the picture */
#app.aud{padding:0;gap:0}
#app.aud .side,#app.aud .bar{display:none}
#app.aud .main{grid-template-columns:1fr;gap:0}
#app.aud .stagewrap{container-type:size;display:grid}
#app.aud .stage{width:min(100cqw,calc(100cqh*16/9));border-radius:0;cursor:none}

.sheet{position:absolute;inset:0;background:rgba(10,13,15,.96);overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));z-index:5}
.sheet h2{font-family:var(--display);font-size:24px;margin:0 0 4px}
.sheet p{color:var(--dim);margin:0 0 14px}
.sheet h3{font-family:var(--display);color:var(--gold);font-size:18px;margin:20px 0 6px}
.sheet .row{display:grid;grid-template-columns:2.4em minmax(0,11em) minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:8px 4px}
.sheet .row:hover{background:var(--panel)}
.sheet .row.cur{background:var(--panel);color:var(--gold)}
.sheet .row span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
.sheet .close{position:sticky;top:0;float:right}
@media (max-width:640px){.hint{grid-template-columns:1fr}.sheet .row{grid-template-columns:2.2em minmax(0,1fr)}.sheet .row span:last-child{grid-column:2}}

/* ---------- scene motion ---------- */
.steam{animation:rise 5s ease-in infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.8)}18%{opacity:.75}100%{opacity:0;transform:translateY(-170px) scale(1.7)}}
.tw{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.swing{animation:swing 3.2s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes sway{from{transform:skewX(-2deg)}to{transform:skewX(2.5deg)}}
.rustle{animation:rustle 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rustle{from{transform:rotate(-1.2deg)}to{transform:rotate(1.4deg)}}
.pulse{animation:pulse 2.6s ease-in-out infinite alternate}
.pulseS{animation:pulse 7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.scroll{animation:scroll 20s linear infinite}
@keyframes scroll{to{transform:translateX(-1600px)}}
.scrollR{animation:scrollR 20s linear infinite}
@keyframes scrollR{from{transform:translateX(-1600px)}to{transform:translateX(0)}}
.drift{animation:drift 120s linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
.mote{animation:mote 9s linear infinite;opacity:0}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}25%{opacity:.9}100%{opacity:0;transform:translate(40px,-190px)}}
.snow{animation:snow 12s linear infinite}
@keyframes snow{to{transform:translate(var(--dx,40px),960px)}}
.leaf{animation:leaf 11s linear infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes leaf{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translate(var(--dx,150px),560px) rotate(340deg)}}
.flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flame{from{transform:scaleY(.75)}to{transform:scaleY(1.2)}}
.bob{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-2px)}to{transform:translateY(3px)}}
.bounce{animation:bounce 1.1s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes bounce{from{transform:translateY(-60px)}to{transform:translateY(0)}}
.sweep{animation:sweep 10s ease-in-out infinite;mix-blend-mode:screen}
@keyframes sweep{0%,35%{transform:translateX(0)}75%,100%{transform:translateX(2700px)}}
.moth{animation:moth 4s linear infinite}
@keyframes moth{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.tlr{animation:tlr 8s steps(1) infinite}.tlg{animation:tlg 8s steps(1) infinite}
@keyframes tlr{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes tlg{0%,49%{opacity:.15}50%,100%{opacity:1}}
.mh-slow{animation:mhs 90s linear both}.mh-fast{animation:mhf 16s ease-in both}.mh-stop{transform:rotate(90deg)}
@keyframes mhs{from{transform:rotate(0)}to{transform:rotate(30deg)}}
@keyframes mhf{from{transform:rotate(30deg)}to{transform:rotate(90deg)}}
.sh-slow{animation:tick 60s steps(60) infinite}.sh-fast{animation:tick 5s linear infinite}
@keyframes tick{to{transform:rotate(360deg)}}
.pd-slow{animation:swing 2s ease-in-out infinite alternate}.pd-fast{animation:swing .6s ease-in-out infinite alternate}
.dawn{animation:dawn 5s 1s ease both}
@keyframes dawn{from{opacity:0}to{opacity:1}}
.nomotion .stage *{animation-play-state:paused!important}
.nofade .layer{transition:none}
</style>

<div id="app">
  <div class="main">
    <div class="stagewrap">
      <div class="stage" id="stage" aria-label="投影畫面">
        <div class="layer" id="LA"></div><div class="layer" id="LB"></div>
        <div class="grain"></div><div class="shade"></div><div class="black" id="black"></div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
    <aside class="side" aria-label="主控台">
      <div class="box"><div class="lab">下一張　<b id="hNext"></b></div><div class="pvbox"><div class="layer" id="PV"></div></div></div>
      <div class="box" aria-live="polite"><div class="lab">換頁時機</div><div class="cue" id="hCue"></div></div>
      <div class="box"><div class="lab">現在投影</div><div id="hNow"></div></div>
    </aside>
  </div>
  <div class="bar">
    <div class="snd" id="sndRow"><button id="bPause" aria-pressed="false">⏸ 暫停聲音</button><label class="lab" for="rVol">音量</label><input id="rVol" type="range" min="0" max="1" step="0.05" value="0.7"><span class="tracks" id="sFx"></span></div>
    <div class="ctrl">
      <button id="bPrev" aria-label="上一張">◀ 上一張</button>
      <button id="bNext" class="big" aria-label="下一張">下一張 ▶</button>
      <span class="count" id="count"></span>
      <button data-act="1">1 建堂</button><button data-act="2">2 關懷</button><button data-act="3">3 愛餐</button><button data-act="4">4 兒女</button>
      <span class="sp"></span>
      <button id="bList">換頁表</button>
      <button id="bFade" aria-pressed="true">淡入淡出</button>
      <button id="bMotion" aria-pressed="true">動態</button>
      <button id="bBlack" aria-pressed="false">黑幕</button>
      <button id="bShow" class="big">全螢幕放映</button>
    </div>
    <div class="keys">← → 或空白鍵換頁（簡報筆也可以）　F5 或 F 開始放映　Esc 結束放映　B 黑幕　T 淡入淡出　0 環境音　1–6 音效　S 暫停／繼續聲音</div>
  </div>
  <div class="sheet" id="sheet" hidden></div>
</div>

<script>
const W=1600,H=900;
const rnd=seed=>{let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>((s=s*16807%2147483647)-1)/2147483646};
const r=(x,y,w,h,f,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${e}/>`;
const c=(x,y,rr,f,e='')=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="${f}" ${e}/>`;
const el=(x,y,rx,ry,f,e='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const p=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const ln=(d,s,w,e='')=>`<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" ${e}/>`;
const t=(x,y,s,txt,f,e='')=>`<text x="${x}" y="${y}" font-size="${s}" fill="${f}" text-anchor="middle" ${e}>${txt}</text>`;
const vt=(x,y,s,str,f,e='')=>[...str].map((ch,i)=>t(x,y+i*s*1.1,s,ch,f,e)).join('');
const lg=(id,stops,v=true)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${v?0:1}" y2="${v?1:0}">${stops.map(([o,col,op])=>`<stop offset="${o}" stop-color="${col}"${op!=null?` stop-opacity="${op}"`:''}/>`).join('')}</linearGradient>`;
const rg=(id,stops)=>`<radialGradient id="${id}">${stops.map(([o,col,op])=>`<stop offset="${o}" stop-color="${col}"${op!=null?` stop-opacity="${op}"`:''}/>`).join('')}</radialGradient>`;
const svg=(u,defs,body)=>`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><filter id="${u}b" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter><filter id="${u}g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>${defs}</defs>${body}</svg>`;
const steam=(u,x,y,n=3,spread=36,col='#fff',sc=1,dur=5)=>Array.from({length:n},(_,i)=>`<g transform="translate(${x+(i-(n-1)/2)*spread} ${y}) scale(${sc})"><path class="steam" style="animation-delay:${(-i*dur/n-.3).toFixed(2)}s;animation-duration:${dur}s" d="M0 0q-18 -26 0 -52q18 -26 0 -52q-14 -22 0 -44" stroke="${col}" stroke-width="13" stroke-linecap="round" fill="none" filter="url(#${u}b)"/></g>`).join('');
const stars=(seed,n,ymax=380)=>{const R=rnd(seed);return Array.from({length:n},()=>c((R()*W)|0,(R()*ymax)|0,(1+R()*2).toFixed(1),'#fff',`class="tw" style="animation-delay:${(-R()*3).toFixed(1)}s"`)).join('')};
const snow=(seed,n)=>{const R=rnd(seed);return Array.from({length:n},()=>{const d=8+R()*10;return c((R()*W)|0,-20,(2+R()*4).toFixed(1),'#fff',`class="snow" opacity="${(.4+R()*.5).toFixed(2)}" style="--dx:${((R()-.5)*160)|0}px;animation-duration:${d.toFixed(1)}s;animation-delay:${(-R()*d).toFixed(1)}s"`)}).join('')};
const motes=(seed,n,x0,y0,w,h,col='#fff6d0')=>{const R=rnd(seed);return Array.from({length:n},()=>c((x0+R()*w)|0,(y0+R()*h)|0,(1.5+R()*2.5).toFixed(1),col,`class="mote" style="animation-delay:${(-R()*9).toFixed(1)}s"`)).join('')};
const cloud=(y,s,dur,delay)=>`<g class="drift" style="animation-duration:${dur}s;animation-delay:${-delay}s"><g transform="translate(0 ${y}) scale(${s})" fill="#fff" opacity=".85"><ellipse cx="0" cy="0" rx="90" ry="34"/><ellipse cx="-50" cy="-22" rx="50" ry="32"/><ellipse cx="30" cy="-34" rx="60" ry="40"/></g></g>`;
const tree=(x,y,s,trunk,leaf,leaf2)=>`<g transform="translate(${x} ${y}) scale(${s})">${r(-18,-10,36,260,trunk)}<g class="rustle">${c(0,-90,120,leaf)}${c(-95,-30,80,leaf2)}${c(95,-40,85,leaf)}${c(-40,-170,80,leaf2)}${c(55,-160,75,leaf)}</g></g>`;
const glow=(u,x,y,rr,col,cls='pulse',op=.8)=>c(x,y,rr,col,`filter="url(#${u}g)" opacity="${op}" class="${cls}"`);

/* ---------- title card ---------- */
function card(u,{k='',ttl,sub=''}){
  return svg(u,lg(u+'bg',[[0,'#0d2b2b'],[1,'#07161d']]),
   r(0,0,W,H,`url(#${u}bg)`)+snow(21,70)+
   `<rect x="70" y="70" width="1460" height="760" fill="none" stroke="#c9a65a" stroke-width="2"/><rect x="86" y="86" width="1428" height="728" fill="none" stroke="#c9a65a" stroke-width="1" opacity=".5"/>`+
   t(800,220,34,'景美教會聖誕晚會','#c9a65a','letter-spacing="14" font-weight="500"')+
   p('M800 262l9 24 26 2-20 16 7 25-22-14-22 14 7-25-20-16 26-2z','#e0b65a','class="tw"')+
   (k?t(800,400,46,k,'#d9c9a0','letter-spacing="10" font-weight="500"'):'')+
   t(800,k?560:520,ttl.length>6?120:150,ttl,'#f3e3b8','font-weight="900" letter-spacing="8"')+
   ln('M560 640H1040','#c9a65a',2)+
   t(800,712,42,sub,'#d9c9a0','font-weight="500" letter-spacing="4"'));
}

const brick=id=>`<pattern id="${id}" width="72" height="36" patternUnits="userSpaceOnUse"><rect width="72" height="36" fill="#d9b5a2"/><rect x="1" y="1" width="34" height="16" fill="#b4533e"/><rect x="37" y="1" width="34" height="16" fill="#be5c45"/><rect x="-17" y="19" width="34" height="16" fill="#a94a37"/><rect x="19" y="19" width="34" height="16" fill="#b9573f"/><rect x="55" y="19" width="34" height="16" fill="#b04e3a"/></pattern><pattern id="${id}s" width="20" height="64" patternUnits="userSpaceOnUse"><rect width="20" height="64" fill="#d9b5a2"/><rect x="1" y="1" width="18" height="62" fill="#b9573f"/></pattern>`;
const shadow=id=>lg(id,[[0,'#000',.38],[1,'#000',0]]);
const scooter=(x,y,col,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})">${c(0,0,17,'#1c1c1c')}${c(0,0,7,'#8a8f94')}${c(78,0,17,'#1c1c1c')}${c(78,0,7,'#8a8f94')}${p('M-8 -8Q-6 -34 22 -34H48L60 -10H14Q4 -10 -8 -8Z',col)}${p('M56 -10L70 -52h9L72 -8Z',col)}${r(8,-44,40,12,'#222','rx="6"')}${ln('M72 -54L86 -60','#222',5)}${c(80,-46,5,'#f6e7a8')}</g>`;
const bike=(x,y,s=1,bag='')=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="0" r="60" fill="none" stroke="#222" stroke-width="6"/><circle cx="200" cy="0" r="60" fill="none" stroke="#222" stroke-width="6"/>${ln('M0 0L72 -84H160L200 0M72 -84L104 0H0M160 -84L104 0M160 -84L152 -118H182M72 -84L64 -112','#3a4a52',7)}${r(40,-122,56,12,'#222','rx="6"')}${bag?r(-48,-62,70,58,bag,'rx="8"')+r(-44,-70,62,12,'#256e4c','rx="5"'):''}</g>`;

const ambD=u=>shadow(u+'sh')+rg(u+'vg',[[.55,'#000',0],[1,'#000',.3]])+lg(u+'fl',[[0,'#000',0],[1,'#000',.22]]);
const amb=u=>r(0,0,W,H,`url(#${u}vg)`);
const sh=(u,x,y,rx,ry,o=.3)=>el(x,y,rx,ry,'#000',`opacity="${o}" filter="url(#${u}b)"`);

/* ---------- church exterior (from the reference photo: red brick, cross, five pointed windows) ---------- */
function exterior(u,{dusk=true}={}){
  const D=dusk,X=[480,672,864,1056,1248],w=124,yb=566,ys=432,yt=338,R=150;
  const wd=x=>`M${x} ${yb}V${ys}A${R} ${R} 0 0 1 ${x+w/2} ${yt}A${R} ${R} 0 0 1 ${x+w} ${ys}V${yb}Z`;

  thud(){const t=AC.currentTime;tone(90,'sine',t,.25,.9,DEST,50);click(t,.6,220)},
  abacus(){const t=AC.currentTime;let d=0;for(let i=0;i<12;i++){click(t+d,.6,2600+Math.random()*600);d+=.04+Math.random()*.05}},
  box(){const t=AC.currentTime,e=.3,N=[[392,3],[440,1],[392,2],[330,6],[392,3],[440,1],[392,2],[330,6],[587,4],[587,2],[494,6],[523,4],[523,2],[392,6]];let d=0;N.forEach(([f,n])=>{bell(f*2,t+d,.3,DEST,Math.min(2.2,n*e+.5));d+=n*e})},
  tense(){let k=0,ms=520,id;const d=DEST,go=()=>{if(AC.state==='running'){click(AC.currentTime,.9,(k++%2)?1700:2300,d);tone(k%2?147:139,'triangle',AC.currentTime,.12,.25,d);ms=Math.max(230,ms*.985)}id=setTimeout(go,ms)};go();return()=>clearTimeout(id)}
};
const CUES=[ // slide name pattern -> [label, effect]
 [/片頭卡/,[['音樂盒〈平安夜〉','box']]],
 [/夜晚的街道/,[['機車發動','start'],['喇叭','horn']]],
 [/巷子/,[['「叮」看見招牌','ding']]],
 [/毛胚屋（建商開價）/,[['低音「噹」580萬','dong']]],
 [/大陳娜娜家的客廳/,[['急匆匆小快步','run'],['「噹噹！」價錢沒聽錯','dang'],['低音「噹」','dong']]],
 [/毛胚屋（議價）/,[['緊張滴答 開／關','tense'],['成交和弦','chord']]],
 [/早餐店・清晨/,[['腳踏車鈴','bike'],['車門關上','thud']]],
 [/教練場/,[['緊張滴答 開／關','tense'],['「通過」上行音','up']]],
 [/車窗/,[['汽車發動','start'],['喇叭','horn'],['轉彎滑音','slide']]],
 [/早期的教會空間/,[['算盤聲','abacus'],['低音「噹」','dong'],['明亮和弦','chord']]],
 [/菜市場/,[['明亮和弦','chord']]],
 [/教會廚房（早期）/,[['俏皮小快步','run'],['低音「噹」不行！','dong'],['明亮和弦','chord']]],
 [/現在的主日愛餐/,[['明亮和弦','chord']]],
 [/公車/,[['煞車聲','brake']]],
 [/搬家後的新家/,[['「叮」成功高中','ding'],['「叮叮叮」建國中學','ding2'],['雀躍短句','joy'],['「哇哇」很無聊','wah']]]
];
const cuesOf=s=>(CUES.find(c=>c[0].test(s.n))||[0,[]])[1];
/* transport: nothing starts by itself; every sound is a track with a progress bar; changing slide stops them all */
const DUR={ding:1.4,ding2:1.8,dong:1.9,dang:.8,chord:2.1,up:1.4,joy:1.1,bike:1.2,start:2.4,horn:.85,brake:1.5,wah:2.4,run:.85,slide:.8,thud:.35,abacus:1,box:16.2};
const playing=new Map();
const mmss=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
function stopTrack(k){const p=playing.get(k);if(!p)return;playing.delete(k);try{p.g.gain.setTargetAtTime(0,AC.currentTime,.05)}catch(e){}
  setTimeout(()=>{p.stops.forEach(f=>{try{f()}catch(e){}});try{p.g.disconnect()}catch(e){}},400);
  if(p.btn){p.btn.setAttribute('aria-pressed','false');p.btn.classList.remove('loop');p.btn.querySelector('.pb>i').style.width='0';p.btn.querySelector('.tm').textContent=''}}
function stopAll(){[...playing.keys()].forEach(stopTrack)}
function playTrack(k,btn){if(!ac())return;if(playing.has(k))return stopTrack(k);
  if(AC.state!=='running'){AC.resume();setPaused(false)}
  const g=AC.createGain();g.gain.value=1;g.connect(OUT);let stops=[],dur=Infinity;
  if(k==='bed'){g.gain.value=0;g.gain.setTargetAtTime(1,AC.currentTime,.4);stops=bedOf(SL[cur])[2].map(([n,...a])=>PART[n](g,...a))}
  else if(FX[k]){DEST=g;const r=FX[k]();DEST=OUT;if(typeof r==='function')stops=[r];else dur=DUR[k]||1.5}else return;
  playing.set(k,{g,stops,dur,t0:AC.currentTime,btn});
  if(btn){btn.setAttribute('aria-pressed','true');btn.classList.toggle('loop',dur===Infinity)}}
function setPaused(v){$('bPause').textContent=v?'▶ 繼續聲音':'⏸ 暫停聲音';$('bPause').setAttribute('aria-pressed',String(!!v));$('sndRow').classList.toggle('paused',!!v)}
function pauseAll(){if(!ac())return;if(AC.state==='running'){AC.suspend();setPaused(true)}else{AC.resume();setPaused(false)}}
(function meter(){requestAnimationFrame(meter);if(!AC)return;const t=AC.currentTime;
  playing.forEach((p,k)=>{const el=t-p.t0;if(p.dur!==Infinity&&el>=p.dur)return stopTrack(k);
    if(p.btn){if(p.dur!==Infinity)p.btn.querySelector('.pb>i').style.width=(el/p.dur*100).toFixed(1)+'%';p.btn.querySelector('.tm').textContent=p.dur===Infinity?mmss(el):mmss(el)+' / '+mmss(p.dur)}})})();
function soundEnter(i){const s=SL[i],B=bedOf(s),C=cuesOf(s);
  if(AC){stopAll();if(AC.state!=='running')AC.resume()}setPaused(false);
  const trk=(k,key,l)=>`<button class="trk" data-fx="${k}" aria-pressed="false"><span><b>${key}</b> ${l}</span><small class="tm"></small><i class="pb"><i></i></i></button>`;
  $('sFx').innerHTML=(B[2].length?trk('bed',0,'環境音：'+B[1]):'')+C.map(([l,k],n)=>trk(k,n+1,l)).join('')||'<span class="lab">這一張沒有聲音</span>';}
function setVol(v){vol=Math.max(0,Math.min(1,+v));store.set('xmas-vol',vol);if(AC)OUT.gain.setTargetAtTime(vol,AC.currentTime,.05)}



const mine={A:$('LA'),B:$('LB'),flip:false,t:0};let theirs=null;
function paint(T,s,instant){const inn=T.flip?T.A:T.B,out=T.flip?T.B:T.A;T.flip=!T.flip;
  inn.innerHTML=s.s('s'+(uid++)+'_');inn.className='layer on'+(s.tone?' tone-'+s.tone:'');out.classList.remove('on');
  clearTimeout(T.t);T.t=setTimeout(()=>{out.innerHTML=''},instant||!fade?0:1500)}
function show(i,instant){
  i=Math.max(0,Math.min(SL.length-1,i));if(i===cur)return;cur=i;const s=SL[i];
  paint(mine,s,instant);if(theirs&&alive())paint(theirs,s,instant);
  const nx=SL[i+1];
  $('hNow').textContent=`${ACT[s.a]}｜${s.n}`+(s.fx?`（動態：${s.fx}）`:'');
  $('hNext').textContent=nx?nx.n:'沒有了';$('hCue').textContent=nx?nx.cue:'已經是最後一張。';
  const pv=$('PV');if(nx){pv.innerHTML=nx.s('p'+(uid++)+'_');pv.className='layer'+(nx.tone==='past'?' tone-past':'')}else{pv.innerHTML='';pv.className='layer'}
  $('count').textContent=`${i+1} / ${SL.length}`;store.set('xmas-i',i);
  document.querySelectorAll('[data-act]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.act===s.a)));
  if(!$('sheet').hidden)drawSheet();
  soundEnter(i);
}
const next=()=>show(cur+1),prev=()=>show(cur-1);
function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||5000)}
const alive=()=>{try{return!!(aud&&!aud.closed&&aud.document)}catch(e){return false}};
function setMotion(v){motion=!!v;$('bMotion').setAttribute('aria-pressed',String(motion));app.classList.toggle('nomotion',!motion);if(alive())aud.document.body.classList.toggle('nomotion',!motion)}
function setFade(v){fade=!!v;$('bFade').setAttribute('aria-pressed',String(fade));app.classList.toggle('nofade',!fade);if(alive())aud.document.body.classList.toggle('nofade',!fade);store.set('xmas-fade',fade?1:0)}
function setBlack(v){black=!!v;$('bBlack').setAttribute('aria-pressed',String(black));$('black').classList.toggle('on',black);if(alive())aud.document.getElementById('black').classList.toggle('on',black)}
function drawSheet(){let h='<button class="close" id="shClose">關閉</button><h2>換頁表</h2><p>每一列是「換到這一張」的時機。點一列可以直接跳過去。</p>',a=-1;
  SL.forEach((s,i)=>{if(s.a!==a){a=s.a;h+=`<h3>${ACT[a]}</h3>`}h+=`<button class="row${i===cur?' cur':''}" data-go="${i}"><span>${i+1}</span><span>${s.n}</span><span>${s.cue}</span></button>`});
  $('sheet').innerHTML=h}
function sheet(v){const sh=$('sheet');sh.hidden=v!=null?!v:!sh.hidden;if(!sh.hidden)drawSheet()}

/* keys work the same in the console and in the projection window */
function onKey(e){if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')show(0);else if(k==='End')show(SL.length-1);
  else if(k==='F5'||k==='f'||k==='F'){e.preventDefault();running()?0:startShow()}
  else if(k==='b'||k==='B'||k==='.')setBlack(!black);else if(k==='t'||k==='T')setFade(!fade);
  else if(k==='s'||k==='S')pauseAll();
  else if(/^[0-9]$/.test(k)){const b=k==='0'?$('sFx').querySelector('[data-fx="bed"]'):[...$('sFx').querySelectorAll('[data-fx]')].filter(x=>x.dataset.fx!=='bed')[+k-1];if(b)playTrack(b.dataset.fx,b)}
  else if(k==='Escape'){if(!$('sheet').hidden)sheet(false);else endShow()}}

/* ---------- the show ---------- */
const running=()=>solo||alive();
function label(){$('bShow').textContent=running()?'結束放映':'全螢幕放映'}
function audFull(){try{const d=aud.document;if(!d.fullscreenElement)d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
let details=null,framed=false;try{framed=window.top!==window}catch(e){framed=true}
async function startShow(){
  if(running())return endShow();
  // find the other display first, so the projection window is born on it
  let other=null,why='',asked=false;
  if('getScreenDetails'in window){
    try{let st='';try{st=(await navigator.permissions.query({name:'window-management'})).state}catch(e){}
      asked=st==='prompt';if(!details)details=await window.getScreenDetails();
      other=details.screens.find(s=>s!==details.currentScreen)||null;if(!other)why='one'}catch(e){why='denied'}
  }else why='nosupport';
  if(running())return;
  const f=other?`popup,left=${other.availLeft},top=${other.availTop},width=${other.availWidth},height=${other.availHeight},fullscreen`:`popup,left=${(screen.availLeft||0)+screen.availWidth},top=0,width=1280,height=720`;
  let w=null;try{w=window.open('','xmas-show',f)}catch(e){}
  if(!w&&asked&&other){toast('已經可以使用另一個螢幕了。請再按一次「全螢幕放映」。',8000);return}
  if(!w){ // no second window allowed here: show on this screen instead, like a single-display slide show
    solo=true;app.classList.add('aud');label();const p=app.requestFullscreen?app.requestFullscreen():Promise.reject();Promise.resolve(p).catch(()=>{});return}
  aud=w;const css=[...document.querySelectorAll('style')].map(s=>s.textContent).find(c=>c.includes('.layer{'))||'';
  w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>投影畫面</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap"><style>${css}</style><style>html,body{height:100%;margin:0;background:#000;overflow:hidden}.stage{position:absolute;inset:0;margin:auto;width:min(100vw,calc(100vh*16/9));max-width:none;border-radius:0;cursor:none}</style></head><body class="${motion?'':'nomotion'}${fade?'':' nofade'}"><div class="stage"><div class="layer" id="LA"></div><div class="layer" id="LB"></div><div class="grain"></div><div class="shade"></div><div class="black${black?' on':''}" id="black"></div></div></body></html>`);w.document.close();
  theirs={A:w.document.getElementById('LA'),B:w.document.getElementById('LB'),flip:false,t:0};paint(theirs,SL[cur],true);
  w.addEventListener('keydown',onKey);
  w.addEventListener('click',()=>{if(w.document.fullscreenElement)next();else audFull()});
  w.document.addEventListener('fullscreenchange',()=>{if(w.document.fullscreenElement)audWasFull=true;else if(audWasFull)endShow()});
  audWasFull=false;label();
  try{if(other){w.moveTo(other.availLeft,other.availTop);w.resizeTo(other.availWidth,other.availHeight)}}catch(e){}
  try{await w.document.documentElement.requestFullscreen(other?{screen:other}:undefined);return}catch(e){}
  setTimeout(()=>{if(!alive()||aud.document.fullscreenElement)return;
    toast(other?'投影視窗已經放到另一個螢幕。在投影畫面上點一下，它就會全螢幕。'
      :why==='denied'?(framed?'這個頁面現在是嵌在別的網頁裡，瀏覽器不讓它使用另一個螢幕。請把它放到 https 網址（例如 GitHub Pages）單獨開啟。':location.protocol==='file:'?'直接打開檔案時，瀏覽器不讓頁面使用另一個螢幕。請把它放到 https 網址（例如 GitHub Pages）再開啟。':'瀏覽器沒有允許這個頁面使用另一個螢幕。請點網址列左邊的圖示，把「視窗管理」改成允許，再按一次全螢幕放映。')
      :why==='one'?'只偵測到一個螢幕。請確認投影機設定成「延伸」而不是「同步顯示」，再按一次全螢幕放映。'
      :'這個瀏覽器不能自動把視窗放到另一個螢幕，請改用 Chrome 或 Edge。現在可以先把投影視窗拖過去，在上面點一下就會全螢幕。',12000)},600);
}
function endShow(){
  if(solo){solo=false;app.classList.remove('aud');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
  if(aud){try{aud.close()}catch(e){}}aud=null;theirs=null;label()}
setInterval(()=>{if(aud&&!alive()){aud=null;theirs=null;label()}},1000);
document.addEventListener('fullscreenchange',()=>{if(solo&&!document.fullscreenElement)endShow()});
addEventListener('pagehide',()=>{try{aud&&aud.close()}catch(e){}});

$('bNext').onclick=next;$('bPrev').onclick=prev;$('bShow').onclick=startShow;$('bList').onclick=()=>sheet();
$('bPause').onclick=pauseAll;$('rVol').oninput=e=>setVol(e.target.value);
$('sFx').onclick=e=>{const b=e.target.closest('[data-fx]');if(b)playTrack(b.dataset.fx,b)};
$('bMotion').onclick=()=>setMotion(!motion);$('bFade').onclick=()=>setFade(!fade);$('bBlack').onclick=()=>setBlack(!black);
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>show(SL.findIndex(s=>s.a===+b.dataset.act)));
$('sheet').onclick=e=>{const g=e.target.closest('[data-go]');if(g){show(+g.dataset.go);sheet(false)}else if(e.target.id==='shClose')sheet(false)};
$('stage').onclick=e=>{const b=$('stage').getBoundingClientRect();(e.clientX-b.left<b.width*.3)?prev():next()};
let tx=null;$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50){e.preventDefault();d<0?next():prev()}});
addEventListener('keydown',onKey);
let idleT;const wake=()=>{app.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>app.classList.add('idle'),2600)};
addEventListener('mousemove',wake);addEventListener('touchstart',wake,{passive:true});wake();
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}

vol=+store.get('xmas-vol',.7)||.7;$('rVol').value=vol;
setFade(store.get('xmas-fade','1')!=='0');
setMotion(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches));
show(Math.min(SL.length-1,+store.get('xmas-i',0)||0),true);
</script>
